<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toki Menus — All Boards Preview</title>
  <style>
    /*
      4-up wall for Fire Stick / TV / multi-board.
      - Each board paints its own BG (scroll on, single-layer lean path)
      - Iframes at half design res (960×540), scaled up to cells
    */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
      position: fixed;
      inset: 0;
    }

    .wall {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 3px;
      background: #000;
      contain: strict;
      position: relative;
    }

    @media (max-aspect-ratio: 1/1) {
      .wall:not(.is-solo) {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
      }
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: #111;
      min-width: 0;
      min-height: 0;
      cursor: default;
      contain: layout style paint size;
    }

    body.show-chrome .cell {
      cursor: zoom-in;
    }

    /* Half design res — fewer pixels painted per board */
    .cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      border: 0;
      transform-origin: top left;
      background: #000;
      pointer-events: none;
    }

    .cell-hit {
      position: absolute;
      inset: 0;
      z-index: 3;
      cursor: inherit;
    }

    .label {
      position: absolute;
      z-index: 4;
      top: 6px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.88);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
      display: none;
    }

    body.show-chrome .label {
      display: block;
    }

    .wall.is-solo {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }

    .wall.is-solo .cell:not(.is-solo-active) {
      display: none;
    }

    .wall.is-solo .cell.is-solo-active {
      cursor: default;
    }

    body.show-chrome .wall.is-solo .cell.is-solo-active {
      cursor: zoom-out;
    }

    .hud {
      position: fixed;
      z-index: 10;
      right: 10px;
      bottom: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.55);
      font-size: 10px;
      font-weight: 600;
      pointer-events: none;
      display: none;
    }

    body.show-chrome .hud {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wall" id="wall">
    <div class="cell" data-src="index.html" data-name="1 · Bowls">
      <span class="label">1 · Bowls</span>
      <iframe title="Board 1 — Bowls" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
    <div class="cell" data-src="index2.html" data-name="2 · Handhelds">
      <span class="label">2 · Handhelds</span>
      <iframe title="Board 2 — Handhelds" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
    <div class="cell" data-src="index3.html" data-name="3 · Munchies">
      <span class="label">3 · Munchies</span>
      <iframe title="Board 3 — Munchies" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
    <div class="cell" data-src="index4.html" data-name="4 · Drinks">
      <span class="label">4 · Drinks</span>
      <iframe title="Board 4 — Drinks" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
  </div>
  <div class="hud" id="hud"></div>

  <script>
    (function () {
      const TAG = "[TokiMenu preview-all]";
      function log() {
        console.log.apply(console, [TAG].concat([].slice.call(arguments)));
      }
      function info() {
        console.info.apply(console, [TAG].concat([].slice.call(arguments)));
      }
      function warn() {
        console.warn.apply(console, [TAG].concat([].slice.call(arguments)));
      }
      function err() {
        console.error.apply(console, [TAG].concat([].slice.call(arguments)));
      }
      window.addEventListener("error", function (e) {
        err("uncaught", e.message, e.filename + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        err("unhandledrejection", e.reason);
      });
      info("boot", location.href);

      // Half of design stage — Fix 4
      const BOARD_W = 960;
      const BOARD_H = 540;
      const wall = document.getElementById("wall");
      let soloCell = null;

      function chromeEnabled() {
        try {
          const q = new URLSearchParams(window.location.search);
          const c = q.get("chrome");
          if (c === "1" || c === "true" || c === "yes") return true;
          if (c === "0" || c === "false" || c === "no") return false;
        } catch (e) {}
        return false;
      }

      const showChrome = chromeEnabled();
      if (showChrome) {
        document.body.classList.add("show-chrome");
        document.querySelectorAll(".cell-hit").forEach(function (el) {
          el.title = "Click to solo · click again for all boards";
        });
      }

      function fitCell(cell) {
        const iframe = cell.querySelector("iframe");
        if (!iframe) return;
        const cw = cell.clientWidth;
        const ch = cell.clientHeight;
        if (cw < 2 || ch < 2) return;
        const scale = Math.min(cw / BOARD_W, ch / BOARD_H);
        const w = BOARD_W * scale;
        const h = BOARD_H * scale;
        iframe.style.width = BOARD_W + "px";
        iframe.style.height = BOARD_H + "px";
        iframe.style.transform = "scale(" + scale + ")";
        iframe.style.left = Math.round((cw - w) / 2) + "px";
        iframe.style.top = Math.round((ch - h) / 2) + "px";
      }

      function fitAll() {
        document.querySelectorAll(".cell").forEach(fitCell);
        const hud = document.getElementById("hud");
        if (!hud || !showChrome) return;
        if (soloCell) {
          const name = soloCell.getAttribute("data-name") || "Board";
          const s = Math.min(
            soloCell.clientWidth / BOARD_W,
            soloCell.clientHeight / BOARD_H
          );
          hud.textContent =
            "Solo · " +
            name +
            " · scale " +
            s.toFixed(3) +
            " · half-res · click again";
          return;
        }
        const cell = document.querySelector(".cell");
        if (cell) {
          const s = Math.min(
            cell.clientWidth / BOARD_W,
            cell.clientHeight / BOARD_H
          );
          const tall = window.innerWidth / window.innerHeight <= 1;
          hud.textContent =
            "All Boards · " +
            (tall ? "1-col" : "2×2") +
            " · half-res · scale " +
            s.toFixed(3);
        }
      }

      function setSolo(cell) {
        if (soloCell === cell) {
          soloCell.classList.remove("is-solo-active");
          soloCell = null;
          wall.classList.remove("is-solo");
        } else {
          if (soloCell) soloCell.classList.remove("is-solo-active");
          soloCell = cell;
          cell.classList.add("is-solo-active");
          wall.classList.add("is-solo");
        }
        requestAnimationFrame(function () {
          fitAll();
          requestAnimationFrame(fitAll);
        });
      }

      function selectedBoardSet() {
        try {
          const raw = new URLSearchParams(location.search || "").get("boards");
          if (!raw) return null;
          const set = {};
          raw.split(",").forEach(function (p) {
            const n = parseInt(String(p).trim(), 10);
            if (n >= 1 && n <= 4) set[n] = true;
          });
          return Object.keys(set).length ? set : null;
        } catch (e) {
          return null;
        }
      }

      function loadFrames() {
        const allCells = Array.prototype.slice.call(
          document.querySelectorAll(".cell")
        );
        const boardSel = selectedBoardSet();
        if (boardSel) {
          allCells.forEach(function (cell, idx) {
            const n = idx + 1;
            if (!boardSel[n]) {
              cell.style.display = "none";
              cell.setAttribute("data-skipped", "1");
            }
          });
        }
        const cells = allCells.filter(function (c) {
          return c.getAttribute("data-skipped") !== "1";
        });
        const t = Date.now();
        info(
          "loading",
          cells.length,
          "boards @",
          BOARD_W + "×" + BOARD_H,
          "per-board BG",
          boardSel ? "filter=" + Object.keys(boardSel).join(",") : "all"
        );

        cells.forEach(function (cell) {
          const hit = cell.querySelector(".cell-hit");
          const name = cell.getAttribute("data-name") || "";
          if (hit) {
            hit.addEventListener("click", function (e) {
              e.preventDefault();
              info("solo", name);
              setSolo(cell);
            });
          }
        });

        let i = 0;
        function loadNext() {
          if (i >= cells.length) {
            fitAll();
            info("all iframes started");
            return;
          }
          const cell = cells[i];
          const src = cell.getAttribute("data-src");
          const iframe = cell.querySelector("iframe");
          const name = cell.getAttribute("data-name") || src;
          const wallIdx = allCells.indexOf(cell);
          const idx = wallIdx >= 0 ? wallIdx : i;
          i++;
          if (!src || !iframe) {
            warn("cell missing src/iframe", name);
            loadNext();
            return;
          }
          const sep = src.indexOf("?") >= 0 ? "&" : "?";
          const url =
            src +
            sep +
            "preview=all&wall=" +
            idx +
            "&t=" +
            t +
            "-" +
            (idx + 1);
          let done = false;
          function advance() {
            if (done) return;
            done = true;
            fitCell(cell);
            window.setTimeout(loadNext, 150);
          }
          iframe.addEventListener(
            "load",
            function () {
              info("iframe loaded", name);
              advance();
            },
            { once: true }
          );
          iframe.addEventListener(
            "error",
            function () {
              err("iframe error", name, url);
              advance();
            },
            { once: true }
          );
          log("iframe src set", name, "→", url);
          iframe.src = url;
          window.setTimeout(advance, 20000);
        }
        loadNext();
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && soloCell) setSolo(soloCell);
      });
      window.addEventListener("resize", fitAll);

      requestAnimationFrame(function () {
        fitAll();
        loadFrames();
        requestAnimationFrame(fitAll);
      });
      window.setTimeout(fitAll, 400);
      window.setTimeout(fitAll, 1200);
    })();
  </script>
</body>
</html>
