<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toki Menus — All Boards Preview</title>
  <style>
    /*
      Testing wall: all four 1920×1080 boards in one window (2×2).
      Not a production board — each cell is a live iframe of index / index2–4,
      scaled with object-fit-style letterboxing to the cell size.
    */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .wall {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 3px;
      background: #000;
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: #111;
      min-width: 0;
      min-height: 0;
      cursor: zoom-in;
    }

    .cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: 0;
      transform-origin: top left;
      background: #000;
      /* scale / position set by JS */
      /* Clicks hit the overlay so solo works without trapping inside the iframe */
      pointer-events: none;
    }

    /* Transparent hit target above the iframe (iframes swallow clicks otherwise) */
    .cell-hit {
      position: absolute;
      inset: 0;
      z-index: 3;
      cursor: inherit;
    }

    .label {
      position: absolute;
      z-index: 4;
      top: 6px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.88);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
    }

    /* Solo: one cell fills the wall; siblings collapse */
    .wall.is-solo {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }

    .wall.is-solo .cell:not(.is-solo-active) {
      display: none;
    }

    .wall.is-solo .cell.is-solo-active {
      cursor: zoom-out;
    }

    .hud {
      position: fixed;
      z-index: 10;
      right: 10px;
      bottom: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.55);
      font-size: 10px;
      font-weight: 600;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="wall" id="wall">
    <div class="cell" data-src="index.html" data-name="1 · Bowls">
      <span class="label">1 · Bowls</span>
      <iframe title="Board 1 — Bowls" loading="eager"></iframe>
      <div class="cell-hit" title="Click to solo · click again for all boards"></div>
    </div>
    <div class="cell" data-src="index2.html" data-name="2 · Handhelds">
      <span class="label">2 · Handhelds</span>
      <iframe title="Board 2 — Handhelds" loading="eager"></iframe>
      <div class="cell-hit" title="Click to solo · click again for all boards"></div>
    </div>
    <div class="cell" data-src="index3.html" data-name="3 · Munchies">
      <span class="label">3 · Munchies</span>
      <iframe title="Board 3 — Munchies" loading="eager"></iframe>
      <div class="cell-hit" title="Click to solo · click again for all boards"></div>
    </div>
    <div class="cell" data-src="index4.html" data-name="4 · Drinks">
      <span class="label">4 · Drinks</span>
      <iframe title="Board 4 — Drinks" loading="eager"></iframe>
      <div class="cell-hit" title="Click to solo · click again for all boards"></div>
    </div>
  </div>
  <div class="hud" id="hud">All Boards Preview · click a board to solo · click again to restore</div>

  <script>
    (function () {
      const BOARD_W = 1920;
      const BOARD_H = 1080;
      const wall = document.getElementById("wall");
      let soloCell = null;

      function fitCell(cell) {
        const iframe = cell.querySelector("iframe");
        if (!iframe) return;
        const cw = cell.clientWidth;
        const ch = cell.clientHeight;
        if (cw < 2 || ch < 2) return;
        const scale = Math.min(cw / BOARD_W, ch / BOARD_H);
        const w = BOARD_W * scale;
        const h = BOARD_H * scale;
        iframe.style.transform = "scale(" + scale + ")";
        iframe.style.left = Math.round((cw - w) / 2) + "px";
        iframe.style.top = Math.round((ch - h) / 2) + "px";
      }

      function fitAll() {
        document.querySelectorAll(".cell").forEach(fitCell);
        const hud = document.getElementById("hud");
        if (!hud) return;
        if (soloCell) {
          const name = soloCell.getAttribute("data-name") || "Board";
          const s = Math.min(
            soloCell.clientWidth / BOARD_W,
            soloCell.clientHeight / BOARD_H
          );
          hud.textContent =
            "Solo · " +
            name +
            " · scale " +
            s.toFixed(3) +
            " · click again for all boards";
          return;
        }
        const cell = document.querySelector(".cell");
        if (cell) {
          const s = Math.min(
            cell.clientWidth / BOARD_W,
            cell.clientHeight / BOARD_H
          );
          hud.textContent =
            "All Boards Preview · scale " +
            s.toFixed(3) +
            " · click a board to solo";
        }
      }

      function setSolo(cell) {
        if (soloCell === cell) {
          // Second click on the solo cell → restore 2×2
          soloCell.classList.remove("is-solo-active");
          soloCell = null;
          wall.classList.remove("is-solo");
        } else {
          if (soloCell) soloCell.classList.remove("is-solo-active");
          soloCell = cell;
          cell.classList.add("is-solo-active");
          wall.classList.add("is-solo");
        }
        // Refit after layout settles
        requestAnimationFrame(function () {
          fitAll();
          requestAnimationFrame(fitAll);
        });
      }

      function loadFrames() {
        document.querySelectorAll(".cell").forEach(function (cell) {
          const src = cell.getAttribute("data-src");
          const iframe = cell.querySelector("iframe");
          if (!src || !iframe) return;
          // Cache-bust lightly so theme/sheet edits show up on reopen
          const sep = src.indexOf("?") >= 0 ? "&" : "?";
          iframe.src = src + sep + "preview=all&t=" + Date.now();

          const hit = cell.querySelector(".cell-hit");
          if (hit) {
            hit.addEventListener("click", function (e) {
              e.preventDefault();
              setSolo(cell);
            });
          }
        });
      }

      // Esc restores full grid when soloing
      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && soloCell) {
          setSolo(soloCell);
        }
      });

      window.addEventListener("resize", fitAll);
      // Load after first layout so scale is correct before boards paint
      requestAnimationFrame(function () {
        fitAll();
        loadFrames();
        requestAnimationFrame(fitAll);
      });
      // Refit after fonts/boards settle
      window.setTimeout(fitAll, 400);
      window.setTimeout(fitAll, 1200);
    })();
  </script>
</body>
</html>
