<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toki Menus — All Boards Preview</title>
  <style>
    /*
      Testing wall: all four 1920×1080 boards in one window.
      Default 2×2; single column when viewport is portrait or square
      (height ≥ width — covers vertical monitors e.g. 1440×2560 even with
      menu bar / browser chrome shrinking the usable height past a strict 9:16).
      Chrome (labels / HUD) off unless ?chrome=1
    */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
      /* Lock viewport — fewer global layout thrash passes on Stick/WebView */
      position: fixed;
      inset: 0;
    }

    .wall {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 3px;
      background: #000;
      /* Isolate wall geometry from the rest of the page */
      contain: strict;
      position: relative;
    }

    /*
      Portrait or square → one column (boards 1→4).
      9:16 was too strict: 1440×2560 with OS/browser chrome often sits
      just above 9:16 and stayed 2×2. 1/1 = any height ≥ width.
    */
    @media (max-aspect-ratio: 1/1) {
      .wall:not(.is-solo) {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
      }
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: #111;
      min-width: 0;
      min-height: 0;
      cursor: default;
      /*
        Each board is independent: layout/paint inside one cell should not
        invalidate siblings (Fire Stick / low-RAM WebViews).
      */
      contain: layout style paint size;
    }

    body.show-chrome .cell {
      cursor: zoom-in;
    }

    .cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: 0;
      transform-origin: top left;
      background: #000;
      pointer-events: none;
    }

    .cell-hit {
      position: absolute;
      inset: 0;
      z-index: 3;
      cursor: inherit;
    }

    .label {
      position: absolute;
      z-index: 4;
      top: 6px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.88);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
      display: none;
    }

    body.show-chrome .label {
      display: block;
    }

    .wall.is-solo {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }

    .wall.is-solo .cell:not(.is-solo-active) {
      display: none;
    }

    .wall.is-solo .cell.is-solo-active {
      cursor: default;
    }

    body.show-chrome .wall.is-solo .cell.is-solo-active {
      cursor: zoom-out;
    }

    .hud {
      position: fixed;
      z-index: 10;
      right: 10px;
      bottom: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.55);
      font-size: 10px;
      font-weight: 600;
      pointer-events: none;
      display: none;
    }

    body.show-chrome .hud {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wall" id="wall">
    <div class="cell" data-src="index.html" data-name="1 · Bowls">
      <span class="label">1 · Bowls</span>
      <iframe title="Board 1 — Bowls" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
    <div class="cell" data-src="index2.html" data-name="2 · Handhelds">
      <span class="label">2 · Handhelds</span>
      <iframe title="Board 2 — Handhelds" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
    <div class="cell" data-src="index3.html" data-name="3 · Munchies">
      <span class="label">3 · Munchies</span>
      <iframe title="Board 3 — Munchies" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
    <div class="cell" data-src="index4.html" data-name="4 · Drinks">
      <span class="label">4 · Drinks</span>
      <iframe title="Board 4 — Drinks" loading="eager"></iframe>
      <div class="cell-hit" title=""></div>
    </div>
  </div>
  <div class="hud" id="hud"></div>

  <script>
    (function () {
      const TAG = "[TokiMenu preview-all]";
      function log(){ console.log.apply(console, [TAG].concat([].slice.call(arguments))); }
      function info(){ console.info.apply(console, [TAG].concat([].slice.call(arguments))); }
      function warn(){ console.warn.apply(console, [TAG].concat([].slice.call(arguments))); }
      function err(){ console.error.apply(console, [TAG].concat([].slice.call(arguments))); }
      window.addEventListener("error", function(e){
        err("uncaught", e.message, e.filename+":"+e.lineno);
      });
      window.addEventListener("unhandledrejection", function(e){
        err("unhandledrejection", e.reason);
      });
      info("boot", location.href);

      const BOARD_W = 1920;
      const BOARD_H = 1080;
      const wall = document.getElementById("wall");
      let soloCell = null;

      function chromeEnabled() {
        try {
          const q = new URLSearchParams(window.location.search);
          const c = q.get("chrome");
          if (c === "1" || c === "true" || c === "yes") return true;
          if (c === "0" || c === "false" || c === "no") return false;
        } catch (e) {}
        return false;
      }

      const showChrome = chromeEnabled();
      if (showChrome) {
        document.body.classList.add("show-chrome");
        document.querySelectorAll(".cell-hit").forEach(function (el) {
          el.title = "Click to solo · click again for all boards";
        });
      }

      function fitCell(cell) {
        const iframe = cell.querySelector("iframe");
        if (!iframe) return;
        const cw = cell.clientWidth;
        const ch = cell.clientHeight;
        if (cw < 2 || ch < 2) return;
        const scale = Math.min(cw / BOARD_W, ch / BOARD_H);
        const w = BOARD_W * scale;
        const h = BOARD_H * scale;
        iframe.style.transform = "scale(" + scale + ")";
        iframe.style.left = Math.round((cw - w) / 2) + "px";
        iframe.style.top = Math.round((ch - h) / 2) + "px";
      }

      function fitAll() {
        document.querySelectorAll(".cell").forEach(fitCell);
        const hud = document.getElementById("hud");
        if (!hud || !showChrome) return;
        if (soloCell) {
          const name = soloCell.getAttribute("data-name") || "Board";
          const s = Math.min(
            soloCell.clientWidth / BOARD_W,
            soloCell.clientHeight / BOARD_H
          );
          hud.textContent =
            "Solo · " +
            name +
            " · scale " +
            s.toFixed(3) +
            " · click again for all boards";
          return;
        }
        const cell = document.querySelector(".cell");
        if (cell) {
          const s = Math.min(
            cell.clientWidth / BOARD_W,
            cell.clientHeight / BOARD_H
          );
          const tall =
            window.innerWidth / window.innerHeight <= 1;
          hud.textContent =
            "All Boards Preview · " +
            (tall ? "1-column" : "2×2") +
            " · scale " +
            s.toFixed(3) +
            " · click a board to solo";
        }
      }

      function setSolo(cell) {
        if (soloCell === cell) {
          soloCell.classList.remove("is-solo-active");
          soloCell = null;
          wall.classList.remove("is-solo");
        } else {
          if (soloCell) soloCell.classList.remove("is-solo-active");
          soloCell = cell;
          cell.classList.add("is-solo-active");
          wall.classList.add("is-solo");
        }
        requestAnimationFrame(function () {
          fitAll();
          requestAnimationFrame(fitAll);
        });
      }

      /**
       * Load all four boards (product requirement).
       * Sequential start reduces peak RAM; each iframe gets preview=all so
       * menu.js uses the lean wall path (single BG layer, no xlsx thrash).
       */
      function loadFrames() {
        const cells = Array.prototype.slice.call(
          document.querySelectorAll(".cell")
        );
        const t = Date.now();
        info("loading", cells.length, "board iframes (sequential, preview-wall)");

        cells.forEach(function (cell) {
          const hit = cell.querySelector(".cell-hit");
          const name = cell.getAttribute("data-name") || "";
          if (hit) {
            hit.addEventListener("click", function (e) {
              e.preventDefault();
              info("solo", name);
              setSolo(cell);
            });
          }
        });

        let i = 0;
        function loadNext() {
          if (i >= cells.length) {
            fitAll();
            info("all iframes started");
            return;
          }
          const cell = cells[i];
          const src = cell.getAttribute("data-src");
          const iframe = cell.querySelector("iframe");
          const name = cell.getAttribute("data-name") || src;
          const idx = i;
          i++;
          if (!src || !iframe) {
            warn("cell missing src/iframe", name);
            loadNext();
            return;
          }
          const sep = src.indexOf("?") >= 0 ? "&" : "?";
          // pause=1: no slideshow thrash ×4 on weak GPUs
          const url =
            src +
            sep +
            "preview=all&pause=1&t=" +
            t +
            "-" +
            (idx + 1);
          let done = false;
          function advance() {
            if (done) return;
            done = true;
            fitCell(cell);
            window.setTimeout(loadNext, 150);
          }
          iframe.addEventListener("load", function () {
            info("iframe loaded", name);
            advance();
          }, { once: true });
          iframe.addEventListener("error", function () {
            err("iframe error", name, url);
            advance();
          }, { once: true });
          log("iframe src set", name, "→", url);
          iframe.src = url;
          window.setTimeout(advance, 20000);
        }
        loadNext();
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && soloCell) {
          setSolo(soloCell);
        }
      });

      window.addEventListener("resize", fitAll);
      requestAnimationFrame(function () {
        fitAll();
        loadFrames();
        requestAnimationFrame(fitAll);
      });
      window.setTimeout(fitAll, 400);
      window.setTimeout(fitAll, 1200);
    })();
  </script>
</body>
</html>
