<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Tickets</title>
  <link rel="stylesheet" href="css/suite-chrome.css?v=20260819dot1" />
  <style>
    a.card {
      display: block;
      font-weight: 600;
      padding: .7rem .85rem;
      border: 1px solid #bbb;
      border-radius: 10px;
      text-decoration: none;
      min-height: 44px;
      box-sizing: border-box;
      margin: .75rem 0 0;
    }
  </style>
</head>
<body class="suite-page">
  <p class="suite-nav" id="nav">Suite · Deployer · Tickets · Menu Manager</p>
  <h1>Tickets</h1>
  <p class="sub">Tickets live on this Mac (Suite.app or Listener). GitHub Pages cannot write the vault — there is no second ticketer.</p>
  <p class="tiny">On the laptop or Tailscale, Tickets is the Listener home: queues, search, and <b>New ticket</b>.</p>
  <a class="card" id="open" href="http://127.0.0.1:18765/">Open Tickets on this Mac</a>
  <script src="js/surfaces.js?v=20260822suite1"></script>
  <script>
    (function () {
      var html = window.tokiSuiteNavHtml && window.tokiSuiteNavHtml("Tickets");
      if (html) document.getElementById("nav").innerHTML = html;
      var a = document.getElementById("open");
      if (a && window.tokiGetTicketsUrl && !/github\.io/i.test(location.host)) {
        a.href = window.tokiGetTicketsUrl();
      }
    })();
  </script>
</body>
</html>
