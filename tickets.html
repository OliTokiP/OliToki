<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Tickets</title>
  <style>
    :root { color-scheme: light dark; --toki-bg: #fff; }
    @media (prefers-color-scheme: dark) { :root { --toki-bg: #111; } }
    html { -webkit-text-size-adjust: 100%; height: 100%; background: var(--toki-bg); }
    body {
      font: 16px/1.4 system-ui, sans-serif;
      margin: 0 auto;
      padding: 1.5rem 1.75rem 2.25rem;
      max-width: 36rem;
      min-height: 100%;
      box-sizing: border-box;
      background: var(--toki-bg);
    }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    .sub, .tiny { color: #666; font-size: .95rem; }
    .tiny { font-size: .88rem; }
    a { color: inherit; }
    a.card {
      display: block;
      font-weight: 600;
      padding: .7rem .85rem;
      border: 1px solid #bbb;
      border-radius: 10px;
      text-decoration: none;
      min-height: 44px;
      box-sizing: border-box;
      margin: .75rem 0 0;
    }
    @media (prefers-color-scheme: dark) {
      .sub, .tiny { color: #aaa; }
    }
  </style>
</head>
<body>
  <p class="tiny" id="nav">Suite · Deployer · Tickets · Menu Manager</p>
  <h1>Tickets</h1>
  <p class="sub">Tickets live on this Mac (Suite.app or Listener). GitHub Pages cannot write the vault — there is no second ticketer.</p>
  <p class="tiny">On the laptop or Tailscale, Tickets is the Listener home: queues, search, and <b>New ticket</b>.</p>
  <a class="card" id="open" href="http://127.0.0.1:18765/">Open Tickets on this Mac</a>
  <script src="js/surfaces.js?v=20260819tix2"></script>
  <script>
    (function () {
      var html = window.tokiSuiteNavHtml && window.tokiSuiteNavHtml("Tickets");
      if (html) document.getElementById("nav").innerHTML = html;
      var a = document.getElementById("open");
      if (a && window.tokiGetTicketsUrl && !/github\.io/i.test(location.host)) {
        a.href = window.tokiGetTicketsUrl();
      }
    })();
  </script>
</body>
</html>
