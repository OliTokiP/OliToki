<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toki Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Roboto+Condensed:wght@300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/menu.css?v=20260808encore4" />
</head>
<body>
  <div id="stage">
    <!-- Layer 1: galaxy background (rear-most) -->
    <div id="galaxy" aria-hidden="true">
      <img class="galaxy-layer active" id="galaxy-a" alt="" draggable="false" />
      <img class="galaxy-layer" id="galaxy-b" alt="" draggable="false" />
    </div>

    <!-- Layer 2: frame (vector — white header + black panel, diagonal cutout) -->
    <div id="frame" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="none">
        <!--
          Edge of opaque frame: x = 1071.925 + 0.078335 * y  (fit from frame.png @ 1920×1080)
          Header / panel split at y = 234
        -->
        <polygon class="frame-header" points="0,0 1071.9,0 1090.3,234 0,234" />
        <polygon class="frame-panel" points="0,234 1090.3,234 1156.5,1080 0,1080" />
      </svg>
    </div>

    <!-- Layer 3: logo -->
    <div id="logo" role="img" aria-label="Toki">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146.7 193.9" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="logo-outline" d="M124.5,61.3s3.2-6.5,14.6-20.7c0,0,11.8-11-2.5-22.2,0,0-8.8-9.6-20.5-2.6,0,0-33.6,18.4-34.2,56.4,0,0-14.1-8.7-32.8,2.1,0,0-4.4-14.6,12.8-42.4,0,0,11.4-13.7-2.5-24.4,0,0-12.3-12.7-28.3,4.7,0,0-18.2,17.4-22.3,43.3,0,0-4.3,31.7,6.1,47.4,0,0-19.8,17.9-8.3,51.5,11.5,33.6,59.7,36.5,59.7,36.5,0,0,45.5,2.6,67.2-32.6,21.1-34.1-15.7-69.2-15.7-69.2-2.1-13.8,7.5-29.1,7.5-29.1"/>
        <circle class="logo-eye" cx="100.8" cy="136.6" r="7"/>
        <circle class="logo-eye" cx="44.3" cy="136.6" r="7"/>
      </svg>
    </div>

    <!-- Title in white header area -->
    <h1 id="menu-title"></h1>

    <!-- Allergy / food safety disclaimer (top-right) -->
    <p id="disclaimer">Before placing your order, please inform us if you have a food allergy.<br />Consuming raw or undercooked food may lead to foodborne illness.</p>

    <!-- Menu item list in black panel -->
    <div id="menu-list" role="list"></div>

    <!-- Optional Protein / Sauces footer (shared sheets; toggled per board) -->
    <div id="footer-boxes">
      <div id="protein-box" class="info-box">
        <svg class="info-box-shell" viewBox="0 0 768 197" preserveAspectRatio="none" aria-hidden="true">
          <rect class="shell-outer" width="768" height="197" />
          <rect class="shell-body" x="4" y="64" width="760" height="129" />
        </svg>
        <div class="info-box-header">
          <span class="info-box-title" id="protein-title"></span>
          <span class="info-box-subtitle" id="protein-subtitle"></span>
        </div>
        <div class="info-box-body" id="protein-body"></div>
      </div>
      <div id="sauces-box" class="info-box">
        <svg class="info-box-shell" viewBox="0 0 299 197" preserveAspectRatio="none" aria-hidden="true">
          <rect class="shell-outer" width="299" height="197" />
          <rect class="shell-body" x="4" y="64" width="291" height="129" />
        </svg>
        <div class="info-box-header">
          <span class="info-box-title" id="sauces-title"></span>
          <span class="info-box-subtitle" id="sauces-subtitle"></span>
        </div>
        <div class="info-box-body" id="sauces-body"></div>
      </div>
      <div id="footer-drinks-box" class="info-box" hidden>
        <svg class="info-box-shell" viewBox="0 0 350 197" preserveAspectRatio="none" aria-hidden="true">
          <rect class="shell-outer" width="350" height="197" />
          <rect class="shell-body" x="4" y="64" width="342" height="129" />
        </svg>
        <div class="info-box-header">
          <span class="info-box-title" id="footer-drinks-title"></span>
          <span class="info-box-subtitle" id="footer-drinks-subtitle"></span>
        </div>
        <div class="info-box-body" id="footer-drinks-body"></div>
      </div>
    </div>

    <!-- Layer 4: food hero (single) + Family Portrait collage stage -->
    <div id="hero-wrap">
      <img id="hero" alt="" draggable="false" hidden />
    </div>
    <!-- Right of frame cutout: TL/BL on vector edge, TR/BR at screen right -->
    <div id="family-portrait-stage" hidden aria-hidden="true"></div>

    <!-- Layer 5: new sticker — shadow + gold body (hue) + CSS New! -->
    <div id="new-sticker" hidden>
      <img
        class="new-sticker-shadow"
        src="assets/Sticker-Shadow.png"
        alt=""
        draggable="false"
        aria-hidden="true"
      />
      <div class="new-sticker-body">
        <img
          class="new-sticker-body-img"
          src="assets/Sticker-Body.png"
          alt=""
          draggable="false"
          aria-hidden="true"
        />
        <span class="new-sticker-tint" aria-hidden="true"></span>
      </div>
      <span class="new-sticker-label">New!</span>
    </div>
  </div>

  <!-- config.js → Google Sheet ID. menu-data.js = offline fallback only. -->
  <script src="js/data-source.js?v=20260805border1"></script>
  <script src="js/config.js?v=20260808encore1"></script>
  <script src="js/menu-data.js?v=20260805fix1"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/build-info.js?v=20260807ver3"></script>
  <script src="js/menu.js?v=20260808encore3"></script>
</body>
</html>
