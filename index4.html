<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toki Menu — Drinks &amp; Deals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Roboto+Condensed:wght@300;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/menu.css?v=20260807recover1" />
</head>
<body class="board-drinks">
  <div id="stage">
    <!-- Layer 1: galaxy background (visible on the left) -->
    <div id="galaxy" aria-hidden="true">
      <img class="galaxy-layer active" id="galaxy-a" alt="" draggable="false" />
      <img class="galaxy-layer" id="galaxy-b" alt="" draggable="false" />
    </div>

    <!-- Layer 2: frame — horizontal mirror of boards 1–3 (right-side panel) -->
    <div id="frame" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="none">
        <!--
          Mirror of left frame:
          Original white: 0,0 1071.9,0 1090.3,234 0,234
          Original black: 0,234 1090.3,234 1156.5,1080 0,1080
          x' = 1920 − x
        -->
        <polygon class="frame-header" points="1920,0 848.1,0 829.7,234 1920,234" />
        <polygon class="frame-panel" points="1920,234 829.7,234 763.5,1080 1920,1080" />
      </svg>
    </div>

    <!-- Layer 2b: pinstripes masked to black panel, scroll @ ~75% galaxy speed -->
    <div id="stripes" aria-hidden="true">
      <div id="stripes-track"></div>
    </div>

    <!-- Layer 3: logo (top-right of white header) -->
    <div id="logo" role="img" aria-label="Toki">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146.7 193.9" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="logo-outline" d="M124.5,61.3s3.2-6.5,14.6-20.7c0,0,11.8-11-2.5-22.2,0,0-8.8-9.6-20.5-2.6,0,0-33.6,18.4-34.2,56.4,0,0-14.1-8.7-32.8,2.1,0,0-4.4-14.6,12.8-42.4,0,0,11.4-13.7-2.5-24.4,0,0-12.3-12.7-28.3,4.7,0,0-18.2,17.4-22.3,43.3,0,0-4.3,31.7,6.1,47.4,0,0-19.8,17.9-8.3,51.5,11.5,33.6,59.7,36.5,59.7,36.5,0,0,45.5,2.6,67.2-32.6,21.1-34.1-15.7-69.2-15.7-69.2-2.1-13.8,7.5-29.1,7.5-29.1"/>
        <circle class="logo-eye" cx="100.8" cy="136.6" r="7"/>
        <circle class="logo-eye" cx="44.3" cy="136.6" r="7"/>
      </svg>
    </div>

    <h1 id="menu-title"></h1>

    <!-- Allergy / food safety — top-right of left hero frame (same top as boards 1–3) -->
    <p id="disclaimer">Before placing your order, please inform us if you have a food allergy.<br />Consuming raw or undercooked food may lead to foodborne illness.</p>

    <!-- Unused on drinks (kept so shared JS null-checks stay simple) -->
    <div id="menu-list" role="list" hidden></div>

    <!-- Right-side content boxes -->
    <div id="drinks-boxes">
      <div id="announcement-box" class="drinks-box">
        <svg class="drinks-box-shell" viewBox="0 0 976 452" preserveAspectRatio="none" aria-hidden="true">
          <rect class="shell-outer" width="976" height="452" />
          <rect id="announcement-body-rect" class="shell-body-announcement" x="4" y="64" width="968" height="384" />
        </svg>
        <div class="drinks-box-header">
          <span class="drinks-box-title" id="announcement-title"></span>
          <span class="drinks-box-subtitle" id="announcement-subtitle"></span>
        </div>
        <div class="drinks-box-body" id="announcement-body"></div>
      </div>

      <div id="drink-options-box" class="drinks-box">
        <svg class="drinks-box-shell" viewBox="0 0 976 250" preserveAspectRatio="none" aria-hidden="true">
          <rect class="shell-outer" width="976" height="250" />
          <rect class="shell-body" x="4" y="64" width="968" height="182" />
        </svg>
        <div class="drinks-box-header">
          <span class="drinks-box-title" id="drink-box-title"></span>
          <span class="drinks-box-subtitle" id="drink-box-subtitle"></span>
        </div>
        <div class="drinks-box-body" id="drink-box-body"></div>
      </div>
    </div>

    <!-- Hero on the left (over galaxy) -->
    <div id="hero-wrap">
      <img id="hero" alt="" draggable="false" hidden />
    </div>

    <!-- Layer 5: new sticker — shadow + gold body (hue) + CSS New! -->
    <div id="new-sticker" hidden>
      <img
        class="new-sticker-shadow"
        src="assets/Sticker-Shadow.png"
        alt=""
        draggable="false"
        aria-hidden="true"
      />
      <div class="new-sticker-body">
        <img
          class="new-sticker-body-img"
          src="assets/Sticker-Body.png"
          alt=""
          draggable="false"
          aria-hidden="true"
        />
        <span class="new-sticker-tint" aria-hidden="true"></span>
      </div>
      <span class="new-sticker-label">New!</span>
    </div>
  </div>

  <script src="js/data-source.js?v=20260805border1"></script>
  <script src="js/config4.js?v=20260807recover1"></script>
  <script src="js/menu-data.js?v=20260805fix1"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/menu.js?v=20260807recover1"></script>
</body>
</html>
