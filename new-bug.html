<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Log a ticket — OliToki</title>
  <style>
    :root { color-scheme: light dark; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font: 17px/1.45 system-ui, sans-serif;
      margin: 0 auto;
      padding: 1.25rem;
      max-width: 36rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .35rem; }
    .sub { color: #666; margin: 0 0 1rem; font-size: .95rem; }
    .live {
      font-weight: 700;
      padding: .65rem .85rem;
      border-radius: 10px;
      background: #eee;
      margin: 0 0 1.25rem;
    }
    @media (prefers-color-scheme: dark) {
      .live { background: #2a2a2a; }
      .sub { color: #aaa; }
    }
    label, .lab { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input[type=text], textarea {
      width: 100%; box-sizing: border-box; font: inherit;
      padding: .55rem .65rem; border: 1px solid #bbb; border-radius: 8px;
      font-size: 16px;
    }
    .picks { display: flex; gap: .55rem; flex-wrap: wrap; }
    .pick {
      font-weight: 500; margin: 0; padding: .6rem .8rem;
      border: 1px solid #bbb; border-radius: 8px;
      display: flex; gap: .4rem; align-items: center;
      font-size: 16px;
      min-height: 44px;
      position: relative;
    }
    .pick input[type="file"] {
      position: absolute; inset: 0; opacity: 0.02; width: 100%; height: 100%; cursor: pointer;
    }
    #screens { display: none; }
    #screens.on { display: block; }
    .row { display: flex; align-items: center; gap: .5rem; margin-top: 1rem; }
    .row label { margin: 0; font-weight: 500; }
    button {
      margin-top: 1.25rem; width: 100%; font: inherit; font-weight: 700;
      padding: .9rem; border: 0; border-radius: 10px;
      background: #1a1a1a; color: #fff;
    }
    a { color: inherit; }

    .attach-picks { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .25rem; }
    .attach-preview { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
    .attach-preview .att {
      border: 1px solid #bbb; border-radius: 8px; padding: .35rem; font-size: .8rem;
      max-width: 128px; position: relative; background: #fafafa;
    }
    .attach-preview img { max-width: 100%; max-height: 78px; display: block; border-radius: 4px; }
    .attach-preview .nm { word-break: break-all; margin-top: .2rem; }
    .att .x {
      position: absolute; top: -6px; right: -6px; background: #fff; color: #111;
      border: 1px solid #999; border-radius: 50%; width: 18px; height: 18px;
      line-height: 16px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      .attach-preview .att { background: #222; border-color: #444; }
      .att .x { background: #111; color: #ddd; border-color: #555; }
    }

    @media (max-width: 520px) {
      body { padding: .75rem; }
      h1 { font-size: 1.25rem; }
      .sub { font-size: .9rem; }
      .live { padding: .5rem .65rem; font-size: .9rem; margin-bottom: 1rem; }
      label, .lab { margin: .75rem 0 .3rem; }
      input[type=text], textarea { padding: .6rem .7rem; font-size: 16px; }
      .pick { padding: .65rem .85rem; font-size: 16px; }
      button { padding: .85rem; margin-top: 1rem; }
      .picks { gap: .4rem; }
      .attach-preview .att { max-width: 92px; font-size: .72rem; }
    }
  </style>
</head>
<body>
  <h1 id="heading">New ticket</h1>
  <p class="sub">Works from your phone anywhere. Files a GitHub issue; the Mac writes the vault ticket when it is online.</p>
  <div class="live" id="live">Pages vs git: checking…</div>

  <form id="form">
    <div class="lab">Type</div>
    <div class="picks">
      <label class="pick"><input type="checkbox" name="kind" value="ticket" checked /> Bug</label>
      <label class="pick"><input type="checkbox" name="kind" value="feature" /> Feature request</label>
    </div>

    <div class="lab">Surface</div>
    <div class="picks">
      <label class="pick"><input type="checkbox" name="surface" value="Listener" /> Listener</label>
      <label class="pick"><input type="checkbox" name="surface" value="Menu Manager" /> Menu Manager</label>
      <label class="pick"><input type="checkbox" name="surface" value="Menu Screens" /> Menu Screens</label>
    </div>

    <div id="screens">
      <div class="lab">Which screen</div>
      <div class="picks" id="screen-picks">
        <label class="pick"><input type="checkbox" name="screen" value="index.html" data-label="1 · Bowls" /> 1 · Bowls</label>
        <label class="pick"><input type="checkbox" name="screen" value="index2.html" data-label="2 · Handhelds" /> 2 · Handhelds</label>
        <label class="pick"><input type="checkbox" name="screen" value="index3.html" data-label="3 · Munchies" /> 3 · Munchies</label>
        <label class="pick"><input type="checkbox" name="screen" value="index4.html" data-label="4 · Drinks" /> 4 · Drinks</label>
        <label class="pick"><input type="checkbox" name="screen" value="preview-all.html" data-label="Wall" /> Wall</label>
      </div>
    </div>

    <label>Title <input type="text" name="title" required placeholder="Short title" /></label>
    <label id="report-lab">The report
      <textarea name="report" rows="6" required placeholder="What is wrong, and what you expected."></textarea>
    </label>
    <label>Reminder
      <textarea name="reminder" rows="3" placeholder="Leave blank — filled from the docs on the Mac."></textarea>
    </label>
    <div id="why-wrap" hidden>
      <label>Why <textarea name="why" rows="3" placeholder="Why this matters"></textarea></label>
    </div>
    <div class="lab">Attachments</div>
    <div class="attach-picks">
      <label class="pick">
        <input type="file" id="attach-img" accept="image/*" />
        <span>📷 Image from Photos</span>
      </label>
      <label class="pick">
        <input type="file" id="attach-file" />
        <span>📄 File from Files</span>
      </label>
    </div>
    <div id="attach-preview" class="attach-preview"></div>
    <div class="row">
      <input type="checkbox" name="include" id="inc" />
      <label for="inc">Include in listener</label>
    </div>
    <div class="row">
      <input type="checkbox" name="queued" id="queued" />
      <label for="queued">Mark as queued?</label>
    </div>
    <div class="lab">Model</div>
    <div class="picks" id="model-picks">
      <label class="pick"><input type="radio" name="model" value="Auto" checked /> Auto</label>
      <label class="pick"><input type="radio" name="model" value="grok-4.6" /> grok-4.6</label>
      <label class="pick"><input type="radio" name="model" value="grok-4.5" /> grok-4.5</label>
      <label class="pick"><input type="radio" name="model" value="grok-build" /> grok-build</label>
      <label class="pick"><input type="radio" name="model" value="grok-build-0.1" /> grok-build-0.1</label>
      <label class="pick"><input type="radio" name="model" value="grok-4.3" /> grok-4.3</label>
      <label class="pick"><input type="radio" name="model" value="grok-4.20-non-reasoning" /> grok-4.20-non-reasoning</label>
      <label class="pick"><input type="radio" name="model" value="grok-4.20-reasoning" /> grok-4.20-reasoning</label>
    </div>
    <button type="submit" id="go">Log ticket</button>
  </form>

  <script>
    const REPO = "OliTokiP/OliToki";
    const PAGES = "https://olitokip.github.io/OliToki";
    const params = new URLSearchParams(location.search);

    function onlyOne(name) {
      const boxes = [...document.querySelectorAll('input[name="' + name + '"]')];
      boxes.forEach((box) => {
        box.addEventListener("change", () => {
          if (box.checked) boxes.forEach((o) => { if (o !== box) o.checked = false; });
        });
      });
      return boxes;
    }

    const kinds = onlyOne("kind");
    const surfaces = onlyOne("surface");
    const screens = onlyOne("screen");

    // Preselect from ?type=feature for links from New request note (keep compatibility)
    if (params.get("type") === "feature") {
      kinds.forEach((b) => { b.checked = (b.value === "feature"); });
    }

    function kind() {
      const on = kinds.find((b) => b.checked);
      return on ? on.value : "ticket";
    }

    function updateTypeUI() {
      const isFeature = kind() === "feature";
      const lab = document.getElementById("report-lab");
      if (lab && lab.firstChild) lab.firstChild.textContent = isFeature ? "The request " : "The report ";
      const why = document.getElementById("why-wrap");
      if (why) why.hidden = !isFeature;
    }

    kinds.forEach((box) => {
      box.addEventListener("change", updateTypeUI);
    });
    updateTypeUI();

    const screenBox = document.getElementById("screens");
    surfaces.forEach((box) => {
      box.addEventListener("change", () => {
        screenBox.classList.toggle("on", surface() === "Menu Screens");
      });
    });

    function surface() {
      const on = surfaces.find((b) => b.checked);
      return on ? on.value : "";
    }

    // --- attachments (apple file pickers for images + files) ---
    let attachedFiles = [];
    function renderAttachPreviews() {
      const box = document.getElementById("attach-preview");
      if (!box) return;
      box.innerHTML = "";
      attachedFiles.forEach((f, i) => {
        const el = document.createElement("div");
        el.className = "att";
        if (f.type && f.type.indexOf("image/") === 0) {
          const url = URL.createObjectURL(f);
          const im = document.createElement("img");
          im.src = url;
          im.onload = () => { /* keep url for lifetime of preview */ };
          el.appendChild(im);
        } else {
          const ico = document.createElement("div");
          ico.textContent = "📄";
          ico.style.fontSize = "28px";
          ico.style.lineHeight = "1";
          el.appendChild(ico);
        }
        const nm = document.createElement("div");
        nm.className = "nm";
        const kb = Math.max(1, Math.round((f.size || 0) / 1024));
        nm.textContent = f.name + " (" + kb + "k)";
        el.appendChild(nm);
        const x = document.createElement("div");
        x.className = "x";
        x.textContent = "×";
        x.onclick = () => {
          attachedFiles.splice(i, 1);
          renderAttachPreviews();
        };
        el.appendChild(x);
        box.appendChild(el);
      });
    }
    const imgIn = document.getElementById("attach-img");
    const fileIn = document.getElementById("attach-file");
    if (imgIn) imgIn.addEventListener("change", () => {
      if (imgIn.files && imgIn.files.length) {
        for (let f of imgIn.files) {
          if (f.type && f.type.indexOf("image/") === 0) {
            attachedFiles.push(f);
          }
        }
        renderAttachPreviews();
      }
      imgIn.value = "";
    });
    if (fileIn) fileIn.addEventListener("change", () => {
      if (fileIn.files && fileIn.files.length) {
        for (let f of fileIn.files) attachedFiles.push(f);
        renderAttachPreviews();
      }
      fileIn.value = "";
    });

    function pageInfo() {
      if (surface() === "Listener") {
        return { page: "Listener.md", label: "Listener" };
      }
      if (surface() === "Menu Manager") {
        return { page: "manager.html", label: "Menu Manager" };
      }
      const on = screens.find((b) => b.checked);
      if (on) return { page: on.value, label: on.getAttribute("data-label") };
      return { page: "preview-all.html", label: "Wall" };
    }

    async function refreshLive() {
      const el = document.getElementById("live");
      try {
        const [git, stamp] = await Promise.all([
          fetch("https://api.github.com/repos/" + REPO + "/commits/main", {
            headers: { Accept: "application/vnd.github+json" },
          }).then((r) => r.json()),
          fetch(PAGES + "/js/live-stamp.js?t=" + Date.now()).then((r) =>
            r.ok ? r.text() : ""
          ),
        ]);
        const g = String(git.sha || "").slice(0, 7).toLowerCase();
        const pm = String(stamp).match(/"hash"\s*:\s*"([0-9a-fA-F]+)"/);
        const p = (pm ? pm[1] : "").slice(0, 7).toLowerCase();
        if (g && p && g === p) el.textContent = "Pages vs git: 🟢 " + g + " — safe to check live";
        else if (g || p) el.textContent = "Pages vs git: 🔴 live `" + (p || "?") + "` · git `" + (g || "?") + "` — wait to check live";
        else el.textContent = "Pages vs git: 🔴 could not read";
      } catch (e) {
        el.textContent = "Pages vs git: 🔴 could not read";
      }
    }
    refreshLive();
    setInterval(refreshLive, 30000);

    document.getElementById("form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const surf = surface();
      if (!surf) { alert("Pick Listener, Menu Manager, or Menu Screens."); return; }
      if (surf === "Menu Screens" && !screens.some((b) => b.checked)) {
        alert("Pick which screen.");
        return;
      }
      const title = document.querySelector('[name=title]').value.trim();
      const report = document.querySelector('[name=report]').value.trim();
      if (!title || !report) return;
      const reminder = document.querySelector('[name=reminder]').value.trim();
      const why = (document.querySelector('[name=why]') || {}).value || "";
      const include = document.getElementById("inc").checked;
      const queued = document.getElementById("queued").checked;
      const modelEl = document.querySelector('input[name="model"]:checked');
      const model = modelEl ? modelEl.value : "Auto";
      const info = pageInfo();
      const isFeature = kind() === "feature";
      const k = isFeature ? "feature" : "ticket";
      const reportH = isFeature ? "The request" : "The report";
      let attachNote = "";
      if (attachedFiles.length > 0) {
        attachNote = "\n\n### Attachments\n\n" +
          attachedFiles.map((f) => "- " + f.name).join("\n") +
          "\n\n(Use GitHub's attach button or drag files into the box after the page opens.)";
      }
      const body = [
        "### toki-meta",
        "- type: " + k,
        "- surface: " + surf,
        "- page: " + info.page,
        "- pageLabel: " + info.label,
        "- include: " + (include ? "true" : "false"),
        "- queued: " + (queued ? "true" : "false"),
        "- model: " + model,
        "",
        "### " + reportH,
        "",
        report,
        "",
        "### Reminder",
        "",
        reminder || "_blank — fill from docs_",
        "",
        "### Why",
        "",
        why.trim() || "_",
        attachNote,
      ].join("\n");
      const url =
        "https://github.com/" + REPO + "/issues/new?labels=toki-qa&title=" +
        encodeURIComponent(title) +
        "&body=" + encodeURIComponent(body);
      location.href = url;
    });
  </script>
</body>
</html>
